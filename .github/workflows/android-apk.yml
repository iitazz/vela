name: Android APK

# Manual build of an installable phone/tablet APK (arm64-v8a, debug-signed unless an upload key is
# configured). Download it from the run's artifacts.
on:
  workflow_dispatch:
  push:
    branches: [legendary-train]

permissions:
  contents: read

jobs:
  apk:
    name: Phone APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VELA_ANDROID_ABI: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: sudo apt-get update && sudo apt-get install -y meson ninja-build pkg-config nasm

      - uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.1.12297006 cmake;3.22.1

      # tools/android-tv.sh expects the pinned Bun under .tools/.
      - name: Link Bun
        run: |
          mkdir -p .tools/bun-linux-x64
          ln -s "$(command -v bun)" .tools/bun-linux-x64/bun

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # FFmpeg audio extension, libdovi and libass: slow, so cached by their build scripts.
      - uses: actions/cache@v4
        id: native
        with:
          path: ~/.scratch/vela-build/media3
          key: native-media3-${{ hashFiles('modules/vela-player/android/ffmpeg/build.sh') }}
      - uses: actions/cache@v4
        id: dovi
        with:
          path: ~/.scratch/vela-build/dovi
          key: native-dovi-${{ hashFiles('modules/vela-player/android/dovi/build.sh') }}
      - uses: actions/cache@v4
        id: ass
        with:
          path: ~/.scratch/vela-build/ass
          key: native-ass-${{ hashFiles('modules/vela-player/android/ass/build.sh') }}

      - name: Build native libraries
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          [ "${{ steps.native.outputs.cache-hit }}" = true ] || modules/vela-player/android/ffmpeg/build.sh
          [ "${{ steps.dovi.outputs.cache-hit }}" = true ] || modules/vela-player/android/dovi/build.sh
          [ "${{ steps.ass.outputs.cache-hit }}" = true ] || modules/vela-player/android/ass/build.sh

      - name: Build APK
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          tools/android-tv.sh --prebuild --phone --no-install

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$HOME/.scratch/vela-build/$(basename "$GITHUB_WORKSPACE")/gradle-build/android/Vela/app/outputs/apk/release/app-release.apk" out/Vela-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vela-android-apk
          path: out/Vela-android.apk

      - name: Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /home/runner/.scratch/vela-build/*/android-gradle.log
